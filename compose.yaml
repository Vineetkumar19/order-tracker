services: 
  inventory:
    image: inventory-service:local
    ports:
      - "127.0.0.1:8081:8081"

  order: 
    image: order-service:local
    ports:
      - "127.0.0.1:18080:8080"
    environment:
       INVENTORY_BASE_URL: http://inventory:8081
       SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/order-tracker
       DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in this PowerShell terminal}
    depends_on:
     - inventory